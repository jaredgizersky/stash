version: 2

project_name: stash

before:
  hooks:
    - go mod tidy

builds:
  - id: stash
    main: ./cmd/stash
    binary: stash
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: stash
    ids:
      - stash
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

brews:
  - name: stash
    ids:
      - stash
    repository:
      owner: jaredgizersky
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/jaredgizersky/stash"
    description: "TUI for bookmarking and resuming Claude Code and Codex sessions"
    license: "MIT"
    test: |
      assert_match "Usage:", shell_output("#{bin}/stash --help")

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
